[project]
name = "my-bank"
version = "0.1.0"
description = "Utilities for processing financial transactions and generating reports."
authors = [
  { name = "AlexShcherb1173", email = "Alex_181173@list.ru" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "python-dotenv>=1.1.1,<2.0.0",
  "requests>=2.32.4,<3.0.0",
  "pandas (==2.3.3)",
  "openpyxl>=3.1.5,<4.0.0",
  "deepdiff>=8.5.0,<9.0.0",
  "pandas-stubs>=2.3.0.250703,<3.0.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0.0",
  "pytest-cov>=6.2.1,<7.0.0",
]
lint = [
  "flake8>=7.2.0,<8.0.0",
  "mypy>=1.16.0,<2.0.0",
  "black>=25.1.0,<26.0.0",
  "isort>=6.0.1,<7.0.0",
]

[tool.poetry]
name = "my-bank"
version = "0.1.0"
package-mode = false

[build-system]
requires = ["poetry-core>=2.3.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
python_version = "3.13"